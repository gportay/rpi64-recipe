{{- $firmware_version := or .firmware_version "1.20250430" -}}
{{- $kernel_version := or .kernel_version "6.12.25" -}}
{{- $mirror := or .mirror "http://archive.raspberrypi.com/debian" -}}
{{- $suite := or .suite "bookworm" -}}
{{- $kernel := or .kernel "linux-image-arm64" -}}
{{- $cmdline := or .cmdline " rootwait ro fsck.mode=auto fsck.repair=yes console=ttyS1,115200" -}}
{{- $image := or .image "rpios-rpi64.img" -}}

architecture: arm64

actions:
  # Download all needed proprietary stuff first
  - action: download
    description: Download latest version of the firmware from GitHub
    url: http://github.com/raspberrypi/firmware/archive/{{ $firmware_version }}.tar.gz
    unpack: true     # Unpack downloaded file
    name: firmware # name for usage directory with unpacked content in other actions

  - action: mmdebstrap
    suite: {{ $suite }}
    components:
      - main
      - non-free
      - non-free-firmware
    mirror: {{ $mirror }}
    variant: minbase

  - action: overlay
    description: Copy sources list
    source: overlays/apt
    destination: /etc/apt

  - action: apt
    description: Install extra packages
    packages:
      - adduser
      - bluetooth
      - ca-certificates
      - dbus-user-session
      - iproute2
      - i2c-tools
      - libnss-resolve
      - openssh-server
      - sudo
      - systemd-sysv
      - vim-tiny
      - systemd-timesyncd

  - action: apt
    description: Install kernel and firmware packages for RPi
    packages:
      - rpi.gpio-common

  - action: overlay
    description: Copy firmware files
    source: overlays/fw-config
    destination: /boot/firmware

  - action: overlay
    description: Install RPi boot firmware ({{ $firmware_version }})
    origin: firmware
    source: firmware-{{ $firmware_version }}/boot
    destination: /boot/firmware

  - action: run
    description: Cleanup firmware partition
    chroot: false
    command: bash -c "rm -rf ${ROOTDIR}/boot/firmware/bcm270{8,9}*.dtb ${ROOTDIR}/boot/firmware/kernel{,7,7l}.img"

  - action: overlay
    description: Install RPi modules ({{ $firmware_version }})
    origin: firmware
    source: firmware-{{ $firmware_version }}/modules
    destination: /usr/lib/modules

  - action: run
    description: Cleanup root partition
    chroot: false
    command: bash -c "rm -rf ${ROOTDIR}/usr/lib/modules/6.12.25{,-v7,-v7l}+/"

  - action: run
    description: Set up user
    chroot: true
    script: scripts/setup-user.sh

  - action: run
    description: Add hostname
    chroot: true
    command: echo rpi64 > /etc/hostname

  - action: overlay
    description: Autoload modules
    source: overlays/modules

  - action: overlay
    source: overlays/networkd

  - action: run
    chroot: true
    script: scripts/setup-networking.sh

  - action: image-partition
    imagename: {{ $image }}
    imagesize: 4GB
    partitiontype: msdos
    mountpoints:
      - mountpoint: /
        partition: root
      - mountpoint: /boot/firmware
        partition: firmware
        options: [ x-systemd.automount ]
    partitions:
      - name: firmware
        fs: fat32
        start: 0%
        end: 64MB
      - name: root
        fs: ext4
        start: 64MB
        end: 100%
        flags: [ boot ]

  - action: filesystem-deploy
    description: Deploying filesystem onto image
    setup-kernel-cmdline: true
    append-kernel-cmdline: {{ $cmdline }}

  - action: run
    description: Create block map file
    postprocess: true
    command: bmaptool create {{ $image }} > {{ $image }}.bmap

  - action: run
    description: Compressing final image
    postprocess: true
    command: gzip -f {{ $image }}
